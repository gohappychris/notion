# 매일 장 전/후 자동 실행 (Phase 1 에서 활성화)
# 지금은 수동 실행(workflow_dispatch)만 켜두고, cron 은 키 등록 후 주석 해제.
name: balance-snapshot

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "50 6 * * 1-5"   # 한국장 마감 후 15:50 KST (UTC 06:50)
  #   - cron: "30 21 * * 1-5"  # 미국장 마감 후 06:30 KST (UTC 21:30, 서머타임 기준)

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
          KIWOOM_ENV: ${{ secrets.KIWOOM_ENV }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SNAPSHOTS_DB_ID: ${{ secrets.NOTION_SNAPSHOTS_DB_ID }}
          NOTION_SUMMARY_DB_ID: ${{ secrets.NOTION_SUMMARY_DB_ID }}
